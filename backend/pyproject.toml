[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qednet"
version = "2.0.0"
description = "QED-Net 2.0 — Hybrid Quantum-Classical ML research platform for early disease detection (research & educational use only)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1",
  "xgboost>=2.0", "shap>=0.44", "pennylane>=0.36", "imbalanced-learn>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "celery>=5.3", "redis>=5.0"]
tracking = ["mlflow>=2.11"]
tests = ["pytest>=8.0", "hypothesis>=6.98", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["qednet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests"]
