# Local integrated stack. The free Render service runs filesystem-demo mode;
# enable PostgreSQL/Redis/MinIO only in an environment configured for them.
services:
  app:
    build: .
    ports:
      - "10000:10000"
    environment: &qednet-env
      PORT: "10000"
      QEDNET_WORKSPACE_ROOT: /app
      QEDNET_PYTHON: /opt/qednet-venv/bin/python
      PYTHONPATH: /app/backend
      QEDNET_RUN_MIGRATIONS: "true"
      USE_DB_STORAGE: "true"
      DATABASE_URL: postgresql+psycopg://qednet:qednet@postgres:5432/qednet
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: qednet
      S3_SECRET_KEY: qednet-local-secret
      S3_BUCKET: qednet-artifacts
      S3_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - qednet-experiments:/app/experiments
      - qednet-uploads:/app/data/uploads

  worker:
    build: .
    command: ["/opt/qednet-venv/bin/python", "-m", "arq", "qednet.worker.settings.WorkerSettings"]
    environment: *qednet-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - qednet-experiments:/app/experiments
      - qednet-uploads:/app/data/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qednet
      POSTGRES_PASSWORD: qednet
      POSTGRES_DB: qednet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qednet -d qednet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qednet
      MINIO_ROOT_PASSWORD: qednet-local-secret
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 qednet qednet-local-secret; do sleep 2; done;
        mc mb --ignore-existing local/qednet-artifacts

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qednet-experiments:
  qednet-uploads:
