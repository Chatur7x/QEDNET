# Local integrated stack. The free Render service runs filesystem-demo mode;
# enable PostgreSQL/Redis/RustFS only in an environment configured for them.
services:
  app:
    build: .
    ports:
      - "10000:10000"
    environment: &qednet-env
      PORT: "10000"
      QEDNET_WORKSPACE_ROOT: /app
      QEDNET_PYTHON: /opt/qednet-venv/bin/python
      PYTHONPATH: /app/backend
      QEDNET_RUN_MIGRATIONS: "true"
      USE_DB_STORAGE: "true"
      DATABASE_URL: postgresql+psycopg://qednet:qednet@postgres:5432/qednet
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: qednet
      S3_SECRET_KEY: qednet-local-secret
      S3_BUCKET: qednet-artifacts
      S3_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - qednet-experiments:/app/experiments
      - qednet-uploads:/app/data/uploads

  worker:
    build: .
    command: ["/opt/qednet-venv/bin/python", "-m", "arq", "qednet.worker.settings.WorkerSettings"]
    environment: *qednet-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - qednet-experiments:/app/experiments
      - qednet-uploads:/app/data/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qednet
      POSTGRES_PASSWORD: qednet
      POSTGRES_DB: qednet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qednet -d qednet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: qednet
      RUSTFS_SECRET_KEY: qednet-local-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  qednet-experiments:
  qednet-uploads:
