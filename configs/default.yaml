dataset:
  name: breast_cancer
  compression: pca
  target_dim: 8
  test_size: 0.2
  random_state: 42

model:
  type: vqc
  n_qubits: 8
  layers: 3
  ansatz: strongly_entangling
  encoding: angle
  optimizer: adam
  learning_rate: 0.01
  max_iter: 100
  shots: 1024
  random_state: 42

training:
  outer_folds: 5
  inner_folds: 3
  seeds: 10
  shots: 1024
  n_jobs: 1
  early_stopping: true
  patience: 10

evaluation:
  metrics:
    - auroc
    - auprc
    - sens_at_spec95
    - mcc
    - brier
    - ece
  bootstrap_ci: 2000
  delong_test: true
  decision_curve: true

certificate:
  dequantization_attack:
    - rff
    - nystrom
  entanglement_ablation: parameter_matched
  bottleneck_honesty_meter: true

experiment_name: qednet_breast_cancer_vqc
tags:
  project: qednet
  disease: breast_cancer
  model: vqc