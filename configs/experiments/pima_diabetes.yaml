# QED-Net 2.0 experiment configuration — Pima Indian Diabetes (Tier 2)
experiment_id: exp_pima_diabetes
notes: >
  Flagship end-to-end experiment. Full classical suite + full quantum suite.
  Compute-reduced protocol for the sandbox demo (5-fold outer CV, 3 seeds);
  the full research protocol (inner-CV tuning enabled, 10 seeds) is
  configurable here and used by scripts/reproduce.py --full.

dataset:
  name: pima_diabetes
  target: target

compression:
  method: pca
  target_dim: 8

model:
  type: vqc
  encoding: angle
  n_qubits: 8
  layers: 3
  backend: numpy          # numpy (batched statevector) | pennylane (reference)
  entanglement: true

training:
  outer_folds: 5
  inner_folds: 3
  seeds: [42, 7, 2026]
  shots: null             # null => exact statevector (equivalent to shots=inf)

evaluation:
  bootstrap_samples: 2000
  bootstrap_enabled: true
  delong_test: true
  decision_curve: true
  calibration: platt

cascade:
  enabled: true
  screening_model: logistic_regression
  low_confidence_min: 0.35
  low_confidence_max: 0.65

certificate:
  enabled: true
  dequantization_rff: true
  dequantization_nystrom: true
  entanglement_ablation: true
  bottleneck_honesty_meter: true

models: []   # empty => full default suite (5 classical + 4 quantum)
