name: QED-Net CI

on:
  push:
    branches: [main, member-c-platform]
  pull_request:
    branches: [main, member-c-platform]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Ruff linting
        run: |
          ruff check qednet tests api dashboard

      - name: Run Ruff format check
        run: |
          ruff format --check qednet tests api dashboard

      - name: Run MyPy type checking
        run: |
          mypy qednet

      - name: Run unit tests
        run: |
          pytest tests/test_config.py tests/test_model_interface.py tests/test_pipeline.py -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/test_deploy.py tests/test_api.py -v --tb=short -m "not slow"

      - name: Run leakage guard tests
        run: |
          pytest tests/ -v --tb=short -m "leakage" || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t qednet:latest .

      - name: Test Docker image
        run: |
          docker run --rm qednet:latest python -c "import qednet; print(qednet.__version__)"

  deploy-docs:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          pip install -e ".[docs]"

      - name: Build docs
        run: |
          mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site