[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qednet"
version = "0.1.0"
description = "QED-Net hybrid quantum-classical platform (Member A: quantum core)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pennylane>=0.36",
    "pennylane-lightning>=0.36",
    "torch>=2.0",
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["qednet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
