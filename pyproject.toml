[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qednet"
version = "0.1.0"
description = "QED-Net hybrid quantum-classical platform for early disease detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "QED-Net Team", email = "team@qednet.example"}
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "pennylane>=0.36",
    "pennylane-lightning>=0.36",
    "torch>=2.0",
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.30",
    "qiskit-aer>=0.13",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "imbalanced-learn>=0.11",
    "pandera>=0.18",
    "shap>=0.42",
    "mlflow>=2.8",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "celery>=5.3",
    "redis>=5.0",
    "streamlit>=1.28",
    "psycopg2-binary>=2.9",
    "minio>=7.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[tool.setuptools.packages.find]
include = ["qednet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "B", "C4", "N", "Q", "SIM", "T20", "TCH", "RSE", "PIE"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true